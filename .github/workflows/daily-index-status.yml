name: Daily Index Status

on:
  schedule:
    # 毎日 AM 7:00 JST = UTC 22:00 (前日)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: '照会するURL数 (上限2000)'
        required: false
        default: '1800'
      render_only:
        description: 'APIを叩かずHTMLだけ再生成 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

# 週次ジョブと同時に走ると push が衝突する。インデックス状態の更新どうしも直列化する。
concurrency:
  group: index-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 1,800件 × 約7秒 ÷ 10並列 ≒ 21分。APIが重い日とsitemap取得ぶんの余裕を見る。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch index status
        if: github.event.inputs.render_only != 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: python -m src.index_status.daily --budget ${{ github.event.inputs.budget || 1800 }}

      - name: Render dashboard
        run: python -m src.index_status.render

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index_status/ docs/index-status/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: index status ($(date -u +%Y-%m-%d))"
          # 週次ジョブが先に push していることがあるので rebase してから送る
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push retry $i"
            sleep 5
          done
          exit 1
